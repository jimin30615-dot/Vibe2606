<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘의 할 일</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="tailwind.css" />
</head>
<body class="min-h-screen bg-[radial-gradient(circle_at_top_left,_rgba(191,219,254,0.18),_transparent_34%),radial-gradient(circle_at_bottom_right,_rgba(254,215,170,0.18),_transparent_30%)] text-slate-900">
  <main class="mx-auto max-w-3xl px-4 py-10 sm:px-6">
    <header class="rounded-[2rem] border border-slate-200 bg-white/85 p-8 shadow-[0_25px_80px_rgba(56,189,248,0.12)] backdrop-blur-md mb-8">
      <div>
        <h1 class="text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl">오늘의 할 일</h1>
        <p id="today-date" class="mt-3 text-sm text-slate-500"></p>
      </div>
    </header>

    <section class="rounded-[2rem] border border-slate-200 bg-white/80 p-6 shadow-[0_16px_50px_rgba(15,23,42,0.08)] backdrop-blur-md">
      <form id="todo-form" class="grid gap-4">
        <div class="grid gap-4 sm:grid-cols-[1fr_auto]">
          <label for="todo-input" class="sr-only">할 일 입력</label>
          <input
            id="todo-input"
            type="text"
            placeholder="할 일을 입력하세요"
            autocomplete="off"
            class="rounded-[1.75rem] border border-slate-200 bg-slate-50 px-5 py-4 text-slate-900 shadow-sm outline-none transition focus:border-cyan-300 focus:ring-4 focus:ring-cyan-100"
          />
          <button
            type="submit"
            class="rounded-[1.75rem] bg-gradient-to-r from-sky-400 via-cyan-400 to-fuchsia-400 px-6 py-4 text-sm font-semibold text-white shadow-lg shadow-sky-200/40 transition hover:brightness-105"
          >
            추가
          </button>
        </div>

        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <label class="flex items-center gap-3 text-sm text-slate-600">
            <input id="important-toggle" type="checkbox" class="h-4 w-4 accent-fuchsia-400" />
            <span>중요 표시</span>
          </label>
          <div class="flex flex-wrap gap-2">
            <button id="clear-completed-btn" type="button" class="rounded-full border border-slate-200 bg-slate-100 px-4 py-2 text-sm text-slate-600 transition hover:bg-slate-200">
              완료 항목 삭제
            </button>
            <button id="clear-all-btn" type="button" class="rounded-full border border-slate-200 bg-slate-100 px-4 py-2 text-sm text-slate-600 transition hover:bg-slate-200">
              전체 삭제
            </button>
          </div>
        </div>
      </form>

      <div class="mt-6 flex flex-wrap items-center gap-3 text-sm text-slate-500">
        <span id="task-count">0개</span>
        <span id="completed-count">완료 0개</span>
        <span id="active-count">진행중 0개</span>
      </div>

      <div class="mt-5 flex flex-wrap items-center gap-2 text-sm text-slate-600">
        <span>보기:</span>
        <button type="button" data-filter="all" class="filter-btn rounded-full border border-slate-200 bg-slate-100 px-4 py-2 text-slate-700 transition hover:bg-slate-200">전체</button>
        <button type="button" data-filter="active" class="filter-btn rounded-full border border-slate-200 bg-slate-100 px-4 py-2 text-slate-700 transition hover:bg-slate-200">진행중</button>
        <button type="button" data-filter="completed" class="filter-btn rounded-full border border-slate-200 bg-slate-100 px-4 py-2 text-slate-700 transition hover:bg-slate-200">완료</button>
      </div>

      <div class="mt-5 rounded-[1.5rem] border border-slate-200 bg-slate-50/80 p-4">
        <div class="mb-3 flex items-center justify-between text-sm text-slate-600">
          <span>달성률</span>
          <span id="completion-rate" class="font-semibold text-slate-900">0%</span>
        </div>
        <div class="h-3 overflow-hidden rounded-full bg-slate-200">
          <div id="progress-bar" class="h-full rounded-full bg-gradient-to-r from-cyan-400 via-sky-400 to-fuchsia-400 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <ul id="todo-list" class="mt-6 space-y-4"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
